openapi: 3.1.0
info:
  title: Lahore Ride Hailing API
  version: 0.1.0
  description: >-
    Contract for the assessment demo. The Go API is authoritative for
    identity, fare, eligibility, assignment, and ride state. Estimates use
    fixed Lahore demo coordinates and are approximate. Supabase Auth issues
    access tokens; the Go API validates asymmetric JWTs and reads role/profile
    data from PostgreSQL.
servers:
  - url: http://127.0.0.1:8080
    description: Local Go API; browsers normally use the same-origin Next.js rewrite.
tags:
  - name: Health
    description: Process liveness and PostgreSQL readiness probes.
  - name: Authentication
    description: Current application profile resolved from a verified Supabase access token.
  - name: Locations and quotes
    description: Seeded Lahore locations and server-calculated estimates.
  - name: Rider rides
    description: Rider-owned quote, booking, status, and cancellation operations.
  - name: Driver
    description: Driver availability, eligible requests, and assigned ride lifecycle operations.
paths:
  /healthz:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Probe' }
  /readyz:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Database readiness probe
      security: []
      responses:
        '200':
          description: PostgreSQL is reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Probe' }
        '503':
          description: Database is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Authentication]
      summary: Resolve the application profile for the current Supabase user
      description: Requires a valid Supabase Auth access token. App role and display name are loaded from the ride_hailing profile row, never from user metadata.
      security: [{ SupabaseBearer: [] }]
      responses:
        '200':
          description: Current authenticated identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/locations:
    get:
      operationId: listLocations
      tags: [Locations and quotes]
      summary: List seeded Lahore locations
      security: [{ SupabaseBearer: [] }]
      responses:
        '200':
          description: Seeded locations available to authenticated users.
          content:
            application/json:
              schema:
                type: object
                required: [locations]
                properties:
                  locations:
                    type: array
                    items: { $ref: '#/components/schemas/Location' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/quotes:
    post:
      operationId: createQuote
      tags: [Locations and quotes]
      summary: Calculate a server-side approximate fare and pickup ETA
      description: Rider only. Does not create a ride. Quote is illustrative and is recomputed on ride creation.
      security: [{ SupabaseBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
            example:
              pickup_location_id: 10000000-0000-4000-8000-000000000001
              destination_location_id: 10000000-0000-4000-8000-000000000002
              category: economy
      responses:
        '200':
          description: Approximate quote.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
              example:
                estimated_fare_paisa: 23676
                estimated_distance_meters: 1446
                pickup_eta_minutes: 2
                currency: PKR
                approximate: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/rides:
    post:
      operationId: createRide
      tags: [Rider rides]
      summary: Create a ride
      description: >-
        Rider only. The server recomputes the quote. Requires a rider-scoped
        Idempotency-Key. Same key and normalized request returns the same ride
        with its current state (200); changed request under that key is 409.
      security: [{ SupabaseBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - name: Idempotency-Key
          in: header
          required: true
          description: 1–128 visible ASCII characters; reuse the same value for retries of one intent.
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
            example:
              pickup_location_id: 10000000-0000-4000-8000-000000000001
              destination_location_id: 10000000-0000-4000-8000-000000000002
              category: economy
      responses:
        '201':
          description: Ride created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
              example:
                id: 40000000-0000-4000-8000-000000000001
                rider:
                  id: 20000000-0000-4000-8000-000000000001
                  display_name: Demo Rider
                pickup:
                  id: 10000000-0000-4000-8000-000000000001
                  name: Liberty Market
                  area: Gulberg III
                  city: Lahore
                destination:
                  id: 10000000-0000-4000-8000-000000000002
                  name: MM Alam Road
                  area: Gulberg III
                  city: Lahore
                category: economy
                estimated_fare_paisa: 23676
                estimated_distance_meters: 1446
                pickup_eta_minutes: 2
                currency: PKR
                approximate: true
                status: requested
                assignment: null
                created_at: '2026-11-01T12:00:00Z'
                updated_at: '2026-11-01T12:00:00Z'
        '200':
          description: Idempotent replay of the same ride; representation reflects current persisted state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
              example:
                id: 40000000-0000-4000-8000-000000000001
                rider:
                  id: 20000000-0000-4000-8000-000000000001
                  display_name: Demo Rider
                pickup:
                  id: 10000000-0000-4000-8000-000000000001
                  name: Liberty Market
                  area: Gulberg III
                  city: Lahore
                destination:
                  id: 10000000-0000-4000-8000-000000000002
                  name: MM Alam Road
                  area: Gulberg III
                  city: Lahore
                category: economy
                estimated_fare_paisa: 23676
                estimated_distance_meters: 1446
                pickup_eta_minutes: 2
                currency: PKR
                approximate: true
                status: requested
                assignment: null
                created_at: '2026-11-01T12:00:00Z'
                updated_at: '2026-11-01T12:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/rides/current:
    get:
      operationId: getCurrentRide
      tags: [Rider rides]
      summary: Get the rider's current open ride
      description: Rider only; returns a null ride when there is no requested or accepted ride.
      security: [{ SupabaseBearer: [] }]
      responses:
        '200':
          description: Current open ride, if any.
          content:
            application/json:
              schema:
                type: object
                required: [ride]
                properties:
                  ride:
                    oneOf:
                      - { $ref: '#/components/schemas/Ride' }
                      - { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/rides/{id}:
    get:
      operationId: getRide
      tags: [Rider rides]
      summary: Read an authorized ride
      description: Owning rider or assigned driver only; other users receive a concealed 404.
      security: [{ SupabaseBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Authorized ride representation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/rides/{id}/accept:
    post:
      operationId: acceptRide
      tags: [Driver]
      summary: Atomically accept an eligible requested ride
      description: Eligible available driver only. Locks ride then driver and commits ride, assignment, and driver status together. Repeated accept by the winning driver returns current ride; another winner or ineligibility is 409.
      security: [{ SupabaseBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/RideId'
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '200':
          description: Ride accepted or already assigned to this driver.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/rides/{id}/cancel:
    post:
      operationId: cancelRide
      tags: [Rider rides]
      summary: Cancel the owning rider's requested or accepted ride
      description: An accepted ride releases its driver atomically. Repeating cancellation after cancellation returns the current ride.
      security: [{ SupabaseBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/RideId'
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '200':
          description: Ride cancelled or already cancelled by this rider.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/rides/{id}/complete:
    post:
      operationId: completeRide
      tags: [Driver]
      summary: Complete a ride assigned to the current driver
      description: Assigned driver only. Closes the assignment and makes the driver available atomically. Repeating completion after completion returns the current ride.
      security: [{ SupabaseBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/RideId'
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '200':
          description: Ride completed or already completed by this driver.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/driver/requests:
    get:
      operationId: listEligibleDriverRequests
      tags: [Driver]
      summary: List eligible open ride requests
      description: Driver only. Oldest first, bounded page; contains no rider identity or contact details.
      security: [{ SupabaseBearer: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from the previous response.
          schema: { type: string }
      responses:
        '200':
          description: Eligible requests and optional next cursor.
          content:
            application/json:
              schema:
                type: object
                required: [requests, next_cursor]
                properties:
                  requests:
                    type: array
                    items: { $ref: '#/components/schemas/DriverRequest' }
                  next_cursor:
                    type: [string, 'null']
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/driver/assignment:
    get:
      operationId: getDriverAssignment
      tags: [Driver]
      summary: Read the current driver's active assignment
      security: [{ SupabaseBearer: [] }]
      responses:
        '200':
          description: Active assignment or null.
          content:
            application/json:
              schema:
                type: object
                required: [assignment]
                properties:
                  assignment:
                    oneOf:
                      - { $ref: '#/components/schemas/AssignmentView' }
                      - { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/drivers/me/availability:
    get:
      operationId: getDriverAvailability
      tags: [Driver]
      summary: Read the current driver's availability
      description: Driver only. Returns the persisted status so the dashboard can recover after refresh.
      security: [{ SupabaseBearer: [] }]
      responses:
        '200':
          description: Current driver status.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { $ref: '#/components/schemas/DriverStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    patch:
      operationId: setDriverAvailability
      tags: [Driver]
      summary: Set driver availability
      description: Driver only; `busy` is system-managed. A driver with an active assignment cannot change availability.
      security: [{ SupabaseBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [offline, available] }
      responses:
        '200':
          description: Updated driver status.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { $ref: '#/components/schemas/DriverStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    SupabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token. The Go API validates the signature, issuer, audience, expiry, and subject against the project's public JWKS.
  parameters:
    OriginHeader:
      name: Origin
      in: header
      required: true
      description: Must exactly match the configured application origin for unsafe requests.
      schema: { type: string, format: uri }
    RideId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Malformed JSON or request syntax.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthorized:
      description: Missing, invalid, or expired Supabase access token.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: The profile is not enabled for the demo, the role is insufficient, or the request Origin is not allowed.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Unknown resource or concealed non-owned ride.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: State, eligibility, uniqueness, or idempotency conflict.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ValidationError:
      description: Valid JSON with semantically invalid fields.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TooLarge:
      description: Request body exceeded the configured limit.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    InternalError:
      description: Unexpected error; message is generic and includes request ID.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unavailable:
      description: Authentication storage is unavailable.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    Probe:
      type: object
      required: [status]
      properties:
        status: { type: string, examples: [ok, ready] }
    Role:
      type: string
      enum: [rider, driver]
    DriverStatus:
      type: string
      enum: [offline, available, busy]
    RideStatus:
      type: string
      enum: [requested, accepted, completed, cancelled]
    Category:
      type: string
      enum: [economy, comfort]
    User:
      type: object
      required: [id, email, display_name, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    CurrentUserResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    Location:
      type: object
      required: [id, name, area, city]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        area: { type: string }
        city: { type: string, const: Lahore }
    QuoteRequest:
      type: object
      additionalProperties: false
      required: [pickup_location_id, destination_location_id, category]
      properties:
        pickup_location_id: { type: string, format: uuid }
        destination_location_id: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/Category' }
    Quote:
      type: object
      required: [estimated_fare_paisa, estimated_distance_meters, pickup_eta_minutes, currency, approximate]
      properties:
        estimated_fare_paisa: { type: integer, format: int64, minimum: 0 }
        estimated_distance_meters: { type: integer, format: int64, minimum: 1 }
        pickup_eta_minutes:
          oneOf:
            - { type: integer, minimum: 2 }
            - { type: 'null' }
        currency: { type: string, const: PKR }
        approximate: { type: boolean, const: true }
    AssignmentStatus:
      type: string
      enum: [active, completed, cancelled]
    Assignment:
      type: object
      required: [id, driver_id, status, assigned_at]
      properties:
        id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid }
        driver_display_name: { type: string }
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        assigned_at: { type: string, format: date-time }
    Ride:
      type: object
      required: [id, rider, pickup, destination, category, estimated_fare_paisa, estimated_distance_meters, currency, status, assignment, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        rider:
          type: object
          description: Returned only to the ride owner and assigned driver; contains no contact information.
          required: [id, display_name]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
        pickup: { $ref: '#/components/schemas/Location' }
        destination: { $ref: '#/components/schemas/Location' }
        category: { $ref: '#/components/schemas/Category' }
        estimated_fare_paisa: { type: integer, format: int64, minimum: 0 }
        estimated_distance_meters: { type: integer, format: int64, minimum: 1 }
        pickup_eta_minutes:
          oneOf:
            - { type: integer, minimum: 2 }
            - { type: 'null' }
        currency: { type: string, const: PKR }
        approximate: { type: boolean, const: true }
        status: { $ref: '#/components/schemas/RideStatus' }
        assignment:
          oneOf:
            - { $ref: '#/components/schemas/Assignment' }
            - { type: 'null' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DriverRequest:
      type: object
      required: [id, pickup, destination, category, estimated_fare_paisa, estimated_distance_meters, currency, status, created_at, pickup_distance_meters]
      properties:
        id: { type: string, format: uuid }
        pickup: { $ref: '#/components/schemas/Location' }
        destination: { $ref: '#/components/schemas/Location' }
        category: { $ref: '#/components/schemas/Category' }
        estimated_fare_paisa: { type: integer, format: int64, minimum: 0 }
        estimated_distance_meters: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, const: PKR }
        status: { type: string, const: requested }
        created_at: { type: string, format: date-time }
        pickup_distance_meters: { type: integer, format: int64, minimum: 0, description: Approximate driver-to-pickup distance. }
    AssignmentView:
      type: object
      required: [ride]
      properties:
        ride: { $ref: '#/components/schemas/Ride' }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
